<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetto Dark Hero</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f0f2d; /* Slightly darker outer background for contrast */
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .hero-banner {
            position: relative;
            width: 95%;
            max-width: 1400px;
            height: 80vh;
            background-color: #1F1F69; /* Your requested background color */
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            overflow: hidden;
            color: #FFFFFF; /* Global white text */
        }

        .hero-image {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 100%; 
            z-index: 1;
            /* Optional: Add a subtle blend or brightness filter if image is too dark */
            filter: contrast(1.1);
        }

        .branding {
            z-index: 2;
            flex: 1;
        }

        .branding h1 {
            font-family: 'DotGothic16', sans-serif;
            font-size: 5.5rem;
            letter-spacing: -2px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 10px;
            color: #FFFFFF;
        }

        .branding p {
            font-family: 'DotGothic16', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.8); /* Slightly transparent white for sub-branding */
        }

        .description {
            z-index: 2;
            flex: 1;
            display: flex;
            justify-content: flex-end;
        }

        .description p {
            max-width: 320px;
            font-size: 0.95rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.9);
            text-align: left;
        }

        /* Mobile Adjustments */
        @media (max-width: 1024px) {
            .hero-banner { 
                height: auto; 
                padding: 100px 40px;
                flex-direction: column; 
                text-align: center; 
            }
            .branding h1 { font-size: 3rem; }
            .description { justify-content: center; margin-top: 40px; }
            .hero-image { 
                position: relative; 
                left: 0; 
                transform: none; 
                height: 300px; 
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>

    <section class="hero-banner">
        <div class="branding">
            <h1>MAGNETTO</h1>
            <p>DESIGN STUDIO • LONDON</p>
        </div>

        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=1000&auto=format&fit=crop" 
             alt="Banner Portrait" class="hero-image">

        <div class="description">
            <p>
                At Magnetto, we break boundaries to craft designs that stand out and deliver results. 
                We blend creativity with strategy, turning bold ideas into digital experiences that 
                captivate and inspire.
            </p>
        </div>
    </section>

</body>
</html>
